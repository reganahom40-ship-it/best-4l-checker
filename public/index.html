<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Identifier Availability Dashboard</title>
  <style>
    :root {
      --bg-primary: #121214;
      --bg-secondary: #1a1a1e;
      --bg-tertiary: #252529;
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --text-main: #e3e5e8;
      --text-muted: #949ba4;
      --success: #23a55a;
      --warning: #f0b232;
      --danger: #f23f43;
      --border: #35363c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 span {
      background: var(--bg-tertiary);
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 4px;
      color: var(--accent);
      border: 1px solid var(--border);
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .container {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 20px;
      flex: 1;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--bg-secondary);
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, textarea, select {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-main);
      padding: 8px 12px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      padding: 10px 15px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--bg-tertiary);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: var(--border);
    }

    .btn-danger {
      background-color: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      opacity: 0.9;
    }

    /* Right Dashboard Column */
    .dashboard {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }

    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-val {
      font-size: 1.8rem;
      font-weight: 700;
      margin-top: 5px;
    }

    .stat-card.scanned { color: var(--text-main); }
    .stat-card.available { color: var(--success); border-left: 4px solid var(--success); }
    .stat-card.taken { color: var(--text-muted); }
    .stat-card.rate-limited { color: var(--warning); border-left: 4px solid var(--warning); }
    .stat-card.failed { color: var(--danger); }

    .results-panel {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      min-height: 250px;
    }

    @media (max-width: 768px) {
      .results-panel {
        grid-template-columns: 1fr;
      }
    }

    .result-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    .result-box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .result-list {
      flex: 1;
      background: var(--bg-primary);
      border-radius: 4px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.85rem;
      overflow-y: auto;
      max-height: 300px;
      white-space: pre-wrap;
    }

    .log-panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      height: 200px;
    }

    .log-content {
      flex: 1;
      background: var(--bg-primary);
      border-radius: 4px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.8rem;
      overflow-y: auto;
      color: #00ff66;
    }

    .log-entry {
      margin-bottom: 4px;
    }

    .log-time {
      color: var(--text-muted);
      margin-right: 8px;
    }

    .log-err {
      color: var(--danger);
    }

    .log-warn {
      color: var(--warning);
    }
  </style>
</head>
<body>
  <header>
    <h1>API Identifier Availability Checker <span>v1.0.0</span></h1>
    <div class="subtitle">A compliant bulk checker for verifying identifier availability against custom endpoints.</div>
  </header>

  <div class="container">
    <!-- Left panel: Configuration -->
    <div class="panel">
      <div class="form-group">
        <label for="identifiers">Identifiers to Check (One per line)</label>
        <textarea id="identifiers" placeholder="ab12&#10;cd34&#10;ef56"></textarea>
      </div>

      <div class="form-group">
        <label for="targetUrl">Target Request URL ({id} placeholder)</label>
        <input type="text" id="targetUrl" value="http://localhost:3000/api/mock-check/{id}">
      </div>

      <div class="row-2">
        <div class="form-group">
          <label for="method">HTTP Method</label>
          <select id="method">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
          </select>
        </div>

        <div class="form-group">
          <label for="delay">Base Delay (ms)</label>
          <input type="number" id="delay" value="1000" min="0" step="100">
        </div>
      </div>

      <div class="form-group">
        <label for="headers">Custom Headers (JSON)</label>
        <textarea id="headers" placeholder='{ "Content-Type": "application/json" }'></textarea>
      </div>

      <div class="form-group">
        <label for="requestBody">Request Body ({id} placeholder, optional)</label>
        <textarea id="requestBody" placeholder='{ "username": "{id}" }'></textarea>
      </div>

      <div class="form-group" style="flex-direction: row; align-items: center; gap: 8px;">
        <input type="checkbox" id="autoRetry" checked style="width: auto;">
        <label for="autoRetry" style="cursor: pointer; text-transform: none;">Auto-retry on Rate Limit (429)</label>
      </div>

      <div class="btn-group">
        <button id="btnStart" class="btn-primary">Start Checking</button>
        <button id="btnStop" class="btn-danger" disabled>Stop</button>
      </div>
      <button id="btnReset" class="btn-secondary">Reset Stats</button>
    </div>

    <!-- Right panel: Dashboard & Results -->
    <div class="dashboard">
      <div class="stats-grid">
        <div class="stat-card scanned">
          <label>Scanned / Total</label>
          <div class="stat-val" id="statScanned">0 / 0</div>
        </div>
        <div class="stat-card available">
          <label>Available</label>
          <div class="stat-val" id="statAvailable">0</div>
        </div>
        <div class="stat-card taken">
          <label>Taken / Registered</label>
          <div class="stat-val" id="statTaken">0</div>
        </div>
        <div class="stat-card rate-limited">
          <label>Rate Limited (429)</label>
          <div class="stat-val" id="statLimited">0</div>
        </div>
        <div class="stat-card failed">
          <label>Failed / Errors</label>
          <div class="stat-val" id="statFailed">0</div>
        </div>
      </div>

      <div class="results-panel">
        <div class="result-box">
          <div class="result-box-header">
            <h3>Available Identifiers</h3>
            <button id="btnExport" class="btn-secondary" style="padding: 4px 8px; font-size: 0.75rem; flex: none;">Copy List</button>
          </div>
          <div id="listAvailable" class="result-list"></div>
        </div>

        <div class="result-box">
          <div class="result-box-header">
            <h3>Taken / Checked</h3>
            <button id="btnClearChecked" class="btn-secondary" style="padding: 4px 8px; font-size: 0.75rem; flex: none;">Clear</button>
          </div>
          <div id="listTaken" class="result-list"></div>
        </div>
      </div>

      <div class="log-panel">
        <label>System Live Logs</label>
        <div id="logContent" class="log-content"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
